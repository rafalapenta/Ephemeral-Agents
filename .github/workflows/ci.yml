name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run MyPy (if pyproject.toml configured)
        run: mypy . || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          AGENCY_EMBEDDINGS: hash
        run: pytest --cov=. --cov-report=xml -v

      - name: Run E2E dry-run smoke test
        env:
          AGENCY_EMBEDDINGS: hash
        run: aggency run --dry-run "teste"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: false  # Enable when you have a Codecov token

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run safety check
        run: |
          pip install safety
          pip install -e ".[dev]"
          safety check || true

      - name: Check for secrets (preventive)
        run: |
          echo "Scanning for potential secrets in repository..."
          if grep -r "sk-[a-zA-Z0-9]\{20,\}" . --include="*.py" --include="*.json" --include="*.yaml" 2>/dev/null; then
            echo "::warning::Potential API key found in repository!"
          else
            echo "No obvious secrets detected."
          fi
