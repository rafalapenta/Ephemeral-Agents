name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run MyPy (if pyproject.toml configured)
        run: mypy . || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          AGENCY_EMBEDDINGS: hash
        run: pytest --cov=. --cov-report=xml -v

      - name: Seed database
        env:
          DATABASE_URL: sqlite:///ci_smoke.db
          AGENCY_EMBEDDINGS: hash
        run: |
          python -c "from sqlalchemy import create_engine; from src.database.models import Base; from src.database.usage import ensure_tables; from scripts.seed_skills_catalog import seed_skills_catalog; engine = create_engine('sqlite:///ci_smoke.db'); Base.metadata.create_all(engine); ensure_tables(engine); seed_skills_catalog(engine=engine, db_url='sqlite:///ci_smoke.db')"

      - name: Run E2E dry-run smoke test
        env:
          DATABASE_URL: sqlite:///ci_smoke.db
          AGENCY_EMBEDDINGS: hash
        run: |
          set +e
          output=$(aggency run --dry-run "teste" 2>&1)
          exit_code=$?
          echo "$output"
          if echo "$output" | grep -qiE "OperationalError|no such table|Traceback|Resultado:\s+FAILURE"; then
            echo "Smoke test failed with an unexpected error"
            exit 1
          fi
          if [ $exit_code -eq 0 ] || echo "$output" | grep -qE "SUCCESS|MISSING_SKILL|BLOCKED"; then
            echo "Smoke test passed"
            exit 0
          fi
          exit $exit_code

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: false  # Enable when you have a Codecov token

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run safety check
        run: |
          pip install safety
          pip install -e ".[dev]"
          safety check || true

      - name: Check for secrets (preventive)
        run: |
          echo "Scanning for potential secrets in repository..."
          if grep -r "sk-[a-zA-Z0-9]\{20,\}" . --include="*.py" --include="*.json" --include="*.yaml" 2>/dev/null; then
            echo "::warning::Potential API key found in repository!"
          else
            echo "No obvious secrets detected."
          fi
